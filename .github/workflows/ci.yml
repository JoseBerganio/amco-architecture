name: CI

on:
  pull_request:
  push:
    branches: ["main", "sprint-*"]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable, with dev tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Fresh non-editable install check
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/amco-check"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$RUNNER_TEMP/amco-check/Scripts"; EXT=".exe"
          else
            BIN="$RUNNER_TEMP/amco-check/bin"; EXT=""
          fi
          "$BIN/python" -m pip install .
          "$BIN/amco$EXT" --help