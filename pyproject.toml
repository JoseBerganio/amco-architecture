[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amco"
version = "0.2.0"
description = "Adaptive Memory Controller - local-first memory orchestration prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jose Berganio" }]
dependencies = [
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "rich>=13.7,<15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/JoseBerganio/amco-architecture"

[project.scripts]
amco = "amco.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]